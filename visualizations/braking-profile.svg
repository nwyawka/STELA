<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; }
    .subtitle { font-size: 15px; fill: #526079; }
    .panel-title { font-size: 18px; font-weight: 600; }
    .axis-label { font-size: 14px; }
    .tick { font-size: 12px; fill: #526079; }
    .grid { stroke: #dbe1ea; stroke-width: 1; }
    .frame { fill: none; stroke: #aeb8c7; stroke-width: 1.2; }
    .series { fill: none; stroke: #2764d8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .endpoint { fill: #2764d8; }
    .guide { stroke: #8995a7; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text x="70" y="43" class="title">Emergency braking profile</text>
  <text x="70" y="68" class="subtitle">Initial velocity 2.00 m/s  |  Constant deceleration 1.50 m/s^2  |  Stop time 1.33 s  |  Stopping distance 1.33 m</text>

  <g id="velocity">
    <text x="100" y="98" class="panel-title">Velocity</text>
    <line x1="100" y1="115" x2="1140" y2="115" class="grid"/>
    <line x1="100" y1="180" x2="1140" y2="180" class="grid"/>
    <line x1="100" y1="245" x2="1140" y2="245" class="grid"/>
    <rect x="100" y="115" width="1040" height="130" class="frame"/>
    <polygon points="100,112 1140,242 1140,248 100,118" fill="#2764d8"/>
    <circle cx="1140" cy="245" r="6" class="endpoint"/>
    <text x="82" y="120" text-anchor="end" class="tick">2.0</text>
    <text x="82" y="185" text-anchor="end" class="tick">1.0</text>
    <text x="82" y="250" text-anchor="end" class="tick">0.0</text>
    <text x="1148" y="241" class="axis-label">0.00 m/s</text>
    <text transform="translate(32 180) rotate(-90)" text-anchor="middle" class="axis-label">Velocity (m/s)</text>
  </g>

  <g id="distance">
    <text x="100" y="348" class="panel-title">Distance traveled</text>
    <line x1="100" y1="365" x2="1140" y2="365" class="grid"/>
    <line x1="100" y1="430" x2="1140" y2="430" class="grid"/>
    <line x1="100" y1="495" x2="1140" y2="495" class="grid"/>
    <rect x="100" y="365" width="1040" height="130" class="frame"/>
    <polygon points="100,492 204,467.3 308,445.2 412,425.7 516,408.8 620,394.5 724,382.8 828,373.7 932,367.2 1036,363.3 1140,362 1140,368 1036,369.3 932,373.2 828,379.7 724,388.8 620,400.5 516,414.8 412,431.7 308,451.2 204,473.3 100,498" fill="#2764d8"/>
    <circle cx="1140" cy="365" r="6" class="endpoint"/>
    <text x="82" y="370" text-anchor="end" class="tick">1.33</text>
    <text x="82" y="435" text-anchor="end" class="tick">0.67</text>
    <text x="82" y="500" text-anchor="end" class="tick">0.00</text>
    <text x="1148" y="370" class="axis-label">1.33 m</text>
    <text transform="translate(32 430) rotate(-90)" text-anchor="middle" class="axis-label">Distance (m)</text>
  </g>

  <g id="acceleration">
    <text x="100" y="598" class="panel-title">Acceleration</text>
    <line x1="100" y1="615" x2="1140" y2="615" class="grid"/>
    <line x1="100" y1="680" x2="1140" y2="680" class="grid"/>
    <line x1="100" y1="745" x2="1140" y2="745" class="grid"/>
    <rect x="100" y="615" width="1040" height="130" class="frame"/>
    <rect x="100" y="742" width="1036" height="6" fill="#2764d8"/>
    <line x1="1140" y1="615" x2="1140" y2="745" class="guide"/>
    <circle cx="1140" cy="615" r="6" class="endpoint"/>
    <text x="82" y="620" text-anchor="end" class="tick">0.0</text>
    <text x="82" y="685" text-anchor="end" class="tick">-0.75</text>
    <text x="82" y="750" text-anchor="end" class="tick">-1.50</text>
    <text x="1148" y="620" class="axis-label">0.00 m/s²</text>
    <text transform="translate(32 680) rotate(-90)" text-anchor="middle" class="axis-label">Acceleration (m/s²)</text>
  </g>

  <g id="time-axis">
    <line x1="100" y1="790" x2="1140" y2="790" class="frame"/>
    <line x1="100" y1="790" x2="100" y2="798" class="frame"/>
    <line x1="360" y1="790" x2="360" y2="798" class="frame"/>
    <line x1="620" y1="790" x2="620" y2="798" class="frame"/>
    <line x1="880" y1="790" x2="880" y2="798" class="frame"/>
    <line x1="1140" y1="790" x2="1140" y2="798" class="frame"/>
    <text x="100" y="818" text-anchor="middle" class="tick">0.00</text>
    <text x="360" y="818" text-anchor="middle" class="tick">0.33</text>
    <text x="620" y="818" text-anchor="middle" class="tick">0.67</text>
    <text x="880" y="818" text-anchor="middle" class="tick">1.00</text>
    <text x="1140" y="818" text-anchor="middle" class="tick">1.33</text>
    <text x="620" y="852" text-anchor="middle" class="axis-label">Time (s)</text>
  </g>
</svg>
