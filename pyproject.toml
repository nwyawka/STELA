[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbselang"
version = "0.1.0"
description = "A small, text-first, executable MBSE language"
requires-python = ">=3.11"

[project.scripts]
mbse = "mbselang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

